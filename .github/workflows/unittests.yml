name: Unit tests

on:
  push:
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "*.md"

jobs:
  format:
    if: |
      (github.event_name == 'push' || github.event.pull_request.head.repo.fork) &&
      (!contains(github.event.head_commit.message, 'skip ci'))

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: 3.13
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black toml
      - name: Format source w/ black
        # fail when file(s) would be formatted
        run: black --check arrow_expts tests

  lint:
    if: |
      (github.event_name == 'push' || github.event.pull_request.head.repo.fork) &&
      (!contains(github.event.head_commit.message, 'skip ci'))

    strategy:
      matrix:
        pyver: ["py310", "py313"]

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ruff with Python target version ${{ matrix.pyver }}
        uses: chartboost/ruff-action@v1
        with:
          src: arrow_expts
          args: "check --target-version ${{ matrix.pyver }}"

  test:
    if: |
      (github.event_name == 'push' || github.event.pull_request.head.repo.fork) &&
      (!contains(github.event.head_commit.message, 'skip ci'))
    needs: [format, lint]

    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            python-version: "3.14"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          allow-prereleases: true
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Run pytest
        run: |
          pytest -vv tests

  type-hints:
    if: |
      (github.event_name == 'push' || github.event.pull_request.head.repo.fork) &&
      (!contains(github.event.head_commit.message, 'skip ci'))

    strategy:
      matrix:
        python-version: ["3.10", "3.13", "3.14"]

    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          allow-prereleases: true
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy{,_extensions}
      - name: Type check w/ mypy
        run: echo y | mypy --install-types --check-untyped-defs --pretty arrow_expts
